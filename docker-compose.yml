services:
  # ════════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE — Persistent data stores, cache, object storage, tracing
  # Each database follows the Database-per-Service pattern (no shared DBs).
  # Volumes are persisted across restarts. All services have healthchecks.
  # ════════════════════════════════════════════════════════════════════════════

  # ─── PostgreSQL: IAM Service ─────────────────────────────────────────────
  # Database : iam_db
  # Purpose  : Stores users, sessions, tokens, MFA, roles, and permissions
  # Consumer : services/iam-service
  # Host Port: 5432  (internal: 5432)
  # Creds    : ${IAM_DB_USER:-iam_admin} / ${IAM_DB_PASSWORD:-iam_password}
  # Volume   : iam_postgres_data
  iam-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${IAM_DB_USER:-iam_admin}
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:-iam_password}
      POSTGRES_DB: ${IAM_DB_NAME:-iam_db}
    ports:
      - "5432:5432"
    volumes:
      - iam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${IAM_DB_USER:-iam_admin} -d ${IAM_DB_NAME:-iam_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL: Media Service ───────────────────────────────────────────
  # Database : media_db
  # Purpose  : Stores media metadata, upload records, and signed URL references
  # Consumer : services/media-service, services/media-worker
  # Host Port: 5434  (internal: 5432)
  # Creds    : ${MEDIA_DB_USER:-media_admin} / ${MEDIA_DB_PASSWORD:-media_password}
  # Volume   : media_postgres_data
  media-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${MEDIA_DB_USER:-media_admin}
      POSTGRES_PASSWORD: ${MEDIA_DB_PASSWORD:-media_password}
      POSTGRES_DB: ${MEDIA_DB_NAME:-media_db}
    ports:
      - "5434:5432"
    volumes:
      - media_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${MEDIA_DB_USER:-media_admin} -d ${MEDIA_DB_NAME:-media_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL: Social Service ──────────────────────────────────────────
  # Database : social_db
  # Purpose  : Stores posts, comments, reactions, follow graph, reels, videos
  # Consumer : services/social-service
  # Host Port: 5433  (internal: 5432)
  # Creds    : ${SOCIAL_DB_USER:-social_admin} / ${SOCIAL_DB_PASSWORD:-social_password}
  # Volume   : social_postgres_data
  social-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${SOCIAL_DB_USER:-social_admin}
      POSTGRES_PASSWORD: ${SOCIAL_DB_PASSWORD:-social_password}
      POSTGRES_DB: ${SOCIAL_DB_NAME:-social_db}
    ports:
      - "5433:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SOCIAL_DB_USER:-social_admin} -d ${SOCIAL_DB_NAME:-social_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL: Stories Service ─────────────────────────────────────────
  # Database : stories_db
  # Purpose  : Stores novels, chapters, authors, library shelves, reading
  #            progress, ratings, coin wallet, payouts (55 models)
  # Consumer : services/stories-service  (Prisma client-reading output)
  # Host Port: 5435  (internal: 5432)
  # Creds    : ${STORIES_DB_USER:-stories_admin} / ${STORIES_DB_PASSWORD:-stories_password}
  # Volume   : stories_postgres_data
  stories-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${STORIES_DB_USER:-stories_admin}
      POSTGRES_PASSWORD: ${STORIES_DB_PASSWORD:-stories_password}
      POSTGRES_DB: ${STORIES_DB_NAME:-stories_db}
    ports:
      - "5435:5432"
    volumes:
      - stories_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${STORIES_DB_USER:-stories_admin} -d ${STORIES_DB_NAME:-stories_db}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────
  # Purpose  : Cache, OTP storage, BullMQ job queues (media transcoding),
  #            event bus (pub/sub), view-count flush buffer
  # Consumers: iam-service, media-service, social-service, stories-service,
  #            media-worker
  # Host Port: 6379
  # Password : ${REDIS_PASSWORD:-redis_password}
  # Volume   : redis_data
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD:-redis_password}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PostgreSQL: Keycloak ────────────────────────────────────────────────
  keycloak-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${KEYCLOAK_DB_USER:-keycloak} -d keycloak" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Keycloak 26 (OIDC identity provider) ────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:26.3.3
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak_password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    restart: unless-stopped
    depends_on:
      keycloak-postgres:
        condition: service_healthy

  keycloak-idp-config:
    image: node:22-alpine
    entrypoint: [ "node", "/opt/keycloak/configure-keycloak.mjs" ]
    environment:
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
    volumes:
      - ./infra/keycloak/configure-keycloak.mjs:/opt/keycloak/configure-keycloak.mjs:ro
    restart: "no"
    depends_on:
      keycloak:
        condition: service_started

  # ─── MinIO (S3-compatible object storage) ────────────────────────────────
  # Purpose  : Stores uploaded media files (images, videos, cover art, avatars)
  # Consumers: media-service (upload/signed URL), media-worker (transcoding input/output)
  # API Port : 9000   (S3-compatible endpoint)
  # Console  : 9001   → http://localhost:9001
  # Creds    : ${MINIO_ROOT_USER:-minioadmin} / ${MINIO_ROOT_PASSWORD:-minioadmin123}
  # Volume   : minio_data
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Jaeger (Distributed Tracing) ────────────────────────────────────────
  # Purpose  : Collects and displays OpenTelemetry traces from all services
  # UI       : http://localhost:16686
  # OTLP gRPC: 4317  (OTLP/gRPC collector)
  # OTLP HTTP: 4318  (OTLP/HTTP collector — used by all services)
  # Consumers: gateway, iam-service, media-service, social-service,
  #            stories-service  (via OTEL_EXPORTER_OTLP_ENDPOINT)
  jaeger:
    image: jaegertracing/all-in-one:1.50
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:16686" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════════════════════════════════════════════════════════════════════════
  # BACKEND SERVICES — NestJS microservices
  # ════════════════════════════════════════════════════════════════════════════

  # ─── IAM Service (:3001) ────────────────────────────────────────────────
  # Responsibility: Authentication, Identity, Sessions, MFA, RBAC
  # DB: iam_db (iam-postgres:5432)
  # Depends on: iam-postgres, jaeger, keycloak
  iam-service:
    build:
      context: ./services/iam-service
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    env_file: ./services/iam-service/.env.example
    environment:
      DATABASE_URL: postgresql://${IAM_DB_USER:-iam_admin}:${IAM_DB_PASSWORD:-iam_password}@iam-postgres:5432/${IAM_DB_NAME:-iam_db}?schema=public
      AUTH_JWKS_URI: http://keycloak:8080/realms/reals/protocol/openid-connect/certs
      AUTH_ISSUER: ${KEYCLOAK_ISSUER_URL:-http://localhost:8080/realms/reals}
      AUTH_AUDIENCE: account
      AUTH_CLIENT_ID: account
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      iam-postgres:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ─── Media Service (:3003) ──────────────────────────────────────────────
  # Responsibility: Media upload, metadata indexing, signed URLs, BullMQ dispatch
  # DB: media_db (media-postgres:5432)
  # Depends on: media-postgres, redis, minio, jaeger
  media-service:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    env_file: ./services/media-service/.env.example
    environment:
      MEDIA_DATABASE_URL: postgresql://${MEDIA_DB_USER:-media_admin}:${MEDIA_DB_PASSWORD:-media_password}@media-postgres:5432/${MEDIA_DB_NAME:-media_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost}
      AUTH_JWKS_URI: http://keycloak:8080/realms/reals/protocol/openid-connect/certs
      AUTH_ISSUER: ${KEYCLOAK_ISSUER_URL:-http://localhost:8080/realms/reals}
      AUTH_AUDIENCE: account
      AUTH_CLIENT_ID: account
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3003:3003"
    restart: unless-stopped
    depends_on:
      media-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ─── Social Service (:3002) ─────────────────────────────────────────────
  # Responsibility: Posts, Comments, Reactions, Follow graph, Reels, Videos
  # DB: social_db (social-postgres:5432)
  # Depends on: social-postgres, redis, jaeger
  social-service:
    build:
      context: ./services/social-service
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    env_file: ./services/social-service/.env.example
    environment:
      SOCIAL_DATABASE_URL: postgresql://${SOCIAL_DB_USER:-social_admin}:${SOCIAL_DB_PASSWORD:-social_password}@social-postgres:5432/${SOCIAL_DB_NAME:-social_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      MEDIA_SERVICE_URL: http://media-service:3003/api/v1
      AUTH_JWKS_URI: http://keycloak:8080/realms/reals/protocol/openid-connect/certs
      AUTH_ISSUER: ${KEYCLOAK_ISSUER_URL:-http://localhost:8080/realms/reals}
      AUTH_AUDIENCE: account
      AUTH_CLIENT_ID: account
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3002:3002"
    restart: unless-stopped
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ─── Stories Service (:3004) ────────────────────────────────────────────
  # Responsibility: Novels, Chapters, Volumes, Genres, Library/Shelves,
  #                 Reading progress, Reviews, Coin wallet, Author payouts
  # DB: stories_db (stories-postgres:5432) via STORIES_DATABASE_URL
  # Depends on: stories-postgres, redis, jaeger
  stories-service:
    build:
      context: ./services/stories-service
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    env_file: ./services/stories-service/.env.example
    environment:
      STORIES_DATABASE_URL: postgresql://${STORIES_DB_USER:-stories_admin}:${STORIES_DB_PASSWORD:-stories_password}@stories-postgres:5432/${STORIES_DB_NAME:-stories_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      MEDIA_SERVICE_URL: http://media-service:3003/api/v1
      AUTH_JWKS_URI: http://keycloak:8080/realms/reals/protocol/openid-connect/certs
      AUTH_ISSUER: ${KEYCLOAK_ISSUER_URL:-http://localhost:8080/realms/reals}
      AUTH_AUDIENCE: account
      AUTH_CLIENT_ID: account
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3004:3004"
    restart: unless-stopped
    depends_on:
      stories-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      keycloak:
        condition: service_started

  # ─── API Gateway (:3000) ────────────────────────────────────────────────
  # Responsibility: Public edge router, rate limiting, JWT validation,
  #                 request forwarding to all downstream services
  # Depends on: iam-service, media-service, social-service, stories-service
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    env_file: ./services/gateway/.env.example
    environment:
      IAM_SERVICE_URL: http://iam-service:3001/api/v1
      SOCIAL_SERVICE_URL: http://social-service:3002/api/v1
      MEDIA_SERVICE_URL: http://media-service:3003/api/v1
      STORIES_SERVICE_URL: http://stories-service:3004/api/v1
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: reals
      GATEWAY_PUBLIC_URL: ${GATEWAY_PUBLIC_URL:-http://localhost:3000}
      GATEWAY_APP_HOST: ${GATEWAY_APP_HOST:-localhost:3000}
      IAM_APP_HOST: ${IAM_APP_HOST:-localhost:4200}
      SOCIAL_APP_HOST: ${SOCIAL_APP_HOST:-localhost:4201}
      VIDEO_APP_HOST: ${VIDEO_APP_HOST:-localhost:4202}
      SHOP_APP_HOST: ${SHOP_APP_HOST:-localhost:4203}
      STORIES_APP_HOST: ${STORIES_APP_HOST:-localhost:4204}
      PORTFOLIO_APP_HOST: ${PORTFOLIO_APP_HOST:-localhost:4205}
      IAM_APP_ORIGIN: ${IAM_APP_ORIGIN:-http://localhost:4200}
      SOCIAL_APP_ORIGIN: ${SOCIAL_APP_ORIGIN:-http://localhost:4201}
      VIDEO_APP_ORIGIN: ${VIDEO_APP_ORIGIN:-http://localhost:4202}
      SHOP_APP_ORIGIN: ${SHOP_APP_ORIGIN:-http://localhost:4203}
      STORIES_APP_ORIGIN: ${STORIES_APP_ORIGIN:-http://localhost:4204}
      PORTFOLIO_APP_ORIGIN: ${PORTFOLIO_APP_ORIGIN:-http://localhost:4205}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      iam-service:
        condition: service_started
      media-service:
        condition: service_started
      social-service:
        condition: service_started
      stories-service:
        condition: service_started
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      keycloak-idp-config:
        condition: service_completed_successfully

  # ─── Media Worker (no exposed port) ─────────────────────────────────────
  # Responsibility: Background FFmpeg transcoding, thumbnail generation,
  #                 HLS packaging — consumes BullMQ jobs from Redis
  # Language: Python  (services/media-worker/main.py)
  # Depends on: redis, minio, media-service
  media-worker:
    build:
      context: ./services/media-worker
      dockerfile: Dockerfile
    env_file: ./services/media-worker/.env.example
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      MINIO_ENDPOINT: minio:9000
      MEDIA_SERVICE_URL: http://media-service:3003/api/v1
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      media-service:
        condition: service_started

  # ════════════════════════════════════════════════════════════════════════════
  # FRONTEND CLIENTS — Angular 21 + Nx, served by nginx, proxy /api/ → gateway
  # ════════════════════════════════════════════════════════════════════════════

  # ─── IAM Web Client (:4200) ─────────────────────────────────────────────
  # Responsibility: SSO Login/Register portal + Ecosystem showcase landing page
  # Repo: frontend/iam-web-client
  fe-iam:
    build:
      context: ./frontend/iam-web-client
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    restart: unless-stopped
    depends_on:
      - gateway

  # ─── Social Web Client (:4201) ──────────────────────────────────────────
  # Responsibility: Social feeds, posts, reels, stories, friends
  # Repo: frontend/social-web-client
  fe-social:
    build:
      context: ./frontend/social-web-client
      dockerfile: Dockerfile
    ports:
      - "4201:80"
    restart: unless-stopped
    depends_on:
      - gateway

  # ─── Video Web Client (:4202) ───────────────────────────────────────────
  # Responsibility: Video & Reels player, HLS streaming, watch history
  # Repo: frontend/video-web-client
  fe-video:
    build:
      context: ./frontend/video-web-client
      dockerfile: Dockerfile
    ports:
      - "4202:80"
    restart: unless-stopped
    depends_on:
      - gateway

  # ─── Shop Web Client (:4203) ────────────────────────────────────────────
  # Responsibility: E-commerce storefront, product listing, cart
  # Repo: frontend/shop-web-client
  fe-shop:
    build:
      context: ./frontend/shop-web-client
      dockerfile: Dockerfile
    ports:
      - "4203:80"
    restart: unless-stopped
    depends_on:
      - gateway

  # ─── Stories Web Client (:4204) ─────────────────────────────────────────
  # Responsibility: Novel reading, chapter view, author studio, library shelves
  # Repo: frontend/stories-web-client
  fe-stories:
    build:
      context: ./frontend/stories-web-client
      dockerfile: Dockerfile
    ports:
      - "4204:80"
    restart: unless-stopped
    depends_on:
      - gateway

  # ─── Portfolio Web Client (:4205) ───────────────────────────────────────
  # Responsibility: Developer portfolio (static SPA, no gateway dependency)
  # Repo: frontend/portfolio-web-client
  fe-portfolio:
    build:
      context: ./frontend/portfolio-web-client
      dockerfile: Dockerfile
    ports:
      - "4205:80"
    restart: unless-stopped

# ════════════════════════════════════════════════════════════════════════════
# NAMED VOLUMES — Persistent data; survives container restarts
# Run `docker compose down -v` ONLY if you intend to wipe all local data.
# ════════════════════════════════════════════════════════════════════════════
volumes:
  iam_postgres_data:
  media_postgres_data:
  social_postgres_data:
  stories_postgres_data:
  redis_data:
  minio_data:
  keycloak_postgres_data:
