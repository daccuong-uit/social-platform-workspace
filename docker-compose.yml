
services:
  # ─── Infrastructure ─────────────────────────────────────────────────────────
  iam-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${IAM_DB_USER:-iam_admin}
      POSTGRES_PASSWORD: ${IAM_DB_PASSWORD:-iam_password}
      POSTGRES_DB: ${IAM_DB_NAME:-iam_db}
    ports:
      - "5433:5432"
    volumes:
      - iam_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${IAM_DB_USER:-iam_admin} -d ${IAM_DB_NAME:-iam_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  media-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${MEDIA_DB_USER:-media_admin}
      POSTGRES_PASSWORD: ${MEDIA_DB_PASSWORD:-media_password}
      POSTGRES_DB: ${MEDIA_DB_NAME:-media_db}
    ports:
      - "5434:5432"
    volumes:
      - media_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MEDIA_DB_USER:-media_admin} -d ${MEDIA_DB_NAME:-media_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  social-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${SOCIAL_DB_USER:-social_admin}
      POSTGRES_PASSWORD: ${SOCIAL_DB_PASSWORD:-social_password}
      POSTGRES_DB: ${SOCIAL_DB_NAME:-social_db}
    ports:
      - "5435:5432"
    volumes:
      - social_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOCIAL_DB_USER:-social_admin} -d ${SOCIAL_DB_NAME:-social_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass "${REDIS_PASSWORD:-redis_password}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Observability ──────────────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.50
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Application Services ───────────────────────────────────────────────────
  iam-service:
    build:
      context: ./services/iam-service
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    env_file: ./services/iam-service/.env.example
    environment:
      DATABASE_URL: postgresql://${IAM_DB_USER:-iam_admin}:${IAM_DB_PASSWORD:-iam_password}@iam-postgres:5432/${IAM_DB_NAME:-iam_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3001:3001"
    restart: unless-stopped
    depends_on:
      iam-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  media-service:
    build:
      context: ./services/media-service
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    env_file: ./services/media-service/.env.example
    environment:
      MEDIA_DATABASE_URL: postgresql://${MEDIA_DB_USER:-media_admin}:${MEDIA_DB_PASSWORD:-media_password}@media-postgres:5432/${MEDIA_DB_NAME:-media_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      MINIO_ENDPOINT: minio
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3003:3003"
    restart: unless-stopped
    depends_on:
      media-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  social-service:
    build:
      context: ./services/social-service
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    env_file: ./services/social-service/.env.example
    environment:
      SOCIAL_DATABASE_URL: postgresql://${SOCIAL_DB_USER:-social_admin}:${SOCIAL_DB_PASSWORD:-social_password}@social-postgres:5432/${SOCIAL_DB_NAME:-social_db}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3004:3004"
    restart: unless-stopped
    depends_on:
      social-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      jaeger:
        condition: service_healthy

  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
      args:
        NODE_AUTH_TOKEN: ${NODE_AUTH_TOKEN:-}
    env_file: ./services/gateway/.env.example
    environment:
      IAM_SERVICE_URL: http://iam-service:3001
      MEDIA_SERVICE_URL: http://media-service:3003/api/v1
      SOCIAL_SERVICE_URL: http://social-service:3004/api/v1
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - iam-service
      - media-service
      - social-service

  media-worker:
    build:
      context: ./services/media-worker
      dockerfile: Dockerfile
    env_file: ./services/media-worker/.env.example
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      MINIO_ENDPOINT: minio:9000
      MEDIA_SERVICE_URL: http://media-service:3003
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/social-web-client
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    restart: unless-stopped
    depends_on:
      - gateway

volumes:
  iam_postgres_data:
  media_postgres_data:
  social_postgres_data:
  redis_data:
  minio_data:
